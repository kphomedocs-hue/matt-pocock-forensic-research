name: Phase 4 runtime smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/run_phase4_runtime_smoke.py'
      - 'scripts/reproduce_ct019.py'
      - 'scripts/normalize_phase4_runtime_evidence.py'
      - '.github/workflows/phase4-runtime-smoke.yml'

permissions:
  contents: write

concurrency:
  group: forensic-phase4-runtime-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research state
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Checkout exact frozen source
        uses: actions/checkout@v7.0.1
        with:
          repository: mattpocock/skills
          ref: 3cca18b368ae95cdbdebbff572ccafa662551015
          path: frozen-source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Sync latest research main
        run: git pull --ff-only origin main
      - name: Validate runner prerequisites
        run: |
          command -v bash
          command -v git
          command -v node
          command -v jq
          command -v grep
          test "$(git -C frozen-source rev-parse HEAD)" = "3cca18b368ae95cdbdebbff572ccafa662551015"
      - name: Run isolated Phase 4 runtime smoke
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scripts/run_phase4_runtime_smoke.py --source frozen-source
      - name: Reproduce and adjudicate CT-019
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scripts/reproduce_ct019.py --source frozen-source
      - name: Canonicalize runtime evidence run IDs
        run: python scripts/normalize_phase4_runtime_evidence.py
      - name: Rebuild Phase 4 state after runtime evidence
        run: |
          python scripts/validate_behavior_matrix.py
          python scripts/build_phase4_coverage.py
          python scripts/build_phase4_runtime_queue.py
          python scripts/validate_phase4_runtime_provenance.py
      - name: Refresh foundation after contradiction adjudication
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/validate_foundation.py
      - name: Validate runtime evidence and promotion gate
        run: |
          test -s 04_RUNTIME_SMOKE_RESULTS.json
          test -s 04_RUNTIME_SMOKE_RESULTS.md
          test -s 04_CT019_REPRODUCTION.json
          test -s 04_CT019_REPRODUCTION.md
          python - <<'PY'
          import json
          s = json.load(open('04_RUNTIME_SMOKE_RESULTS.json', encoding='utf-8'))
          r = json.load(open('04_CT019_REPRODUCTION.json', encoding='utf-8'))
          i = json.load(open('04_BEHAVIOR_INTEGRITY.json', encoding='utf-8'))
          c = json.load(open('04_BEHAVIOR_COVERAGE.json', encoding='utf-8'))
          q = json.load(open('04_RUNTIME_OBSERVATION_QUEUE.json', encoding='utf-8'))
          f = json.load(open('00_FOUNDATION_INTEGRITY.json', encoding='utf-8'))
          assert s['frozen_commit'] == '3cca18b368ae95cdbdebbff572ccafa662551015'
          assert s['source_checkout_head'] == s['frozen_commit']
          assert s['synthetic_inputs_only'] is True
          assert s['user_or_live_repo_touched'] is False
          assert s['test_count'] == 6
          assert s['pass_count'] == 6
          assert s['fail_count'] == 0
          assert s['hard_errors'] == []
          assert s['runtime_closure_behavior_ids'] == ['B-016', 'B-019', 'B-020']
          assert s['supporting_only_behavior_ids'] == ['B-018', 'B-056']
          assert r['hard_errors'] == []
          assert r['ct_id'] == 'CT-019' and r['behavior_id'] == 'B-046'
          assert r['simple_assertion_found'] is True
          assert r['double_assertion_found'] is True
          assert r['lowercase_target_control_found'] is False
          assert i['hard_errors'] == []
          assert i['runtime_observed_count'] >= 4
          assert c['covered_skills'] == 37 and c['skill_denominator'] == 37
          assert c['covered_surfaces'] == 71 and c['surface_denominator'] == 71
          assert q['hard_errors'] == []
          assert q['runtime_observed'] == i['runtime_observed_count']
          assert f['hard_errors'] == []
          observed = {x['behavior_id'] for x in q['items'] if x['runtime_observed']}
          assert {'B-016', 'B-019', 'B-020', 'B-046'} <= observed
          # B-018/B-056 are supporting-only in this smoke suite but may be globally
          # runtime-observed by the separate deterministic local-runtime suite.
          b46 = next(x for x in q['items'] if x['behavior_id'] == 'B-046')
          assert b46['state'] == 'CONFIRMED_MATCH'
          register = open('04_CONTRADICTION_REGISTER.md', encoding='utf-8').read()
          assert '| CT-019 | migrate-to-shoehorn assertion discovery — audit correction |' in register
          assert '| AUDIT FALSE POSITIVE / NO SOURCE DISCOVERY GAP | RESOLVED |' in register
          assert '| ↳ CT-019 | AUDIT_TOOLING | FIXED |' in register
          print('runtime_smoke_pass=', f"{s['pass_count']}/{s['test_count']}")
          print('ct019_double_assertion_found=', r['double_assertion_found'])
          print('runtime_observed_total=', i['runtime_observed_count'])
          print('pending_by_class=', q['pending_by_class'])
          PY
      - name: Commit runtime evidence and Phase 4 promotion
        run: |
          paths=(04_RUNTIME_SMOKE_RESULTS.json 04_RUNTIME_SMOKE_RESULTS.md 04_CT019_REPRODUCTION.json 04_CT019_REPRODUCTION.md 04_CONTRADICTION_REGISTER.md 04_BEHAVIOR_MATRIX.json 04_BEHAVIOR_MATRIX.md 04_BEHAVIOR_INTEGRITY.json 04_BEHAVIOR_COVERAGE.json 04_BEHAVIOR_COVERAGE.md 04_RUNTIME_OBSERVATION_QUEUE.json 04_RUNTIME_OBSERVATION_QUEUE.md 00_FOUNDATION_INTEGRITY.json 00_FOUNDATION_INTEGRITY.md)
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- "${paths[@]}"
          if git diff --cached --quiet; then
            echo "Runtime smoke evidence already current"
            exit 0
          fi
          git commit -m "phase4: record runtime evidence and correct CT-019"
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep 1
          done
          echo "Failed to publish Phase 4 runtime evidence" >&2
          exit 1