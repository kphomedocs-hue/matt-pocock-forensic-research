name: Phase 4 runtime smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/run_phase4_runtime_smoke.py'
      - '.github/workflows/phase4-runtime-smoke.yml'

permissions:
  contents: write

concurrency:
  group: forensic-phase4-runtime-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research state
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Checkout exact frozen source
        uses: actions/checkout@v7.0.1
        with:
          repository: mattpocock/skills
          ref: 3cca18b368ae95cdbdebbff572ccafa662551015
          path: frozen-source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Sync latest research main
        run: git pull --ff-only origin main
      - name: Validate runner prerequisites
        run: |
          command -v bash
          command -v git
          command -v node
          command -v jq
          test "$(git -C frozen-source rev-parse HEAD)" = "3cca18b368ae95cdbdebbff572ccafa662551015"
      - name: Run isolated Phase 4 runtime smoke
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scripts/run_phase4_runtime_smoke.py --source frozen-source
      - name: Rebuild Phase 4 state after runtime evidence
        run: |
          python scripts/validate_behavior_matrix.py
          python scripts/build_phase4_coverage.py
          python scripts/build_phase4_runtime_queue.py
      - name: Validate runtime evidence and promotion gate
        run: |
          test -s 04_RUNTIME_SMOKE_RESULTS.json
          test -s 04_RUNTIME_SMOKE_RESULTS.md
          python - <<'PY'
          import json
          s = json.load(open('04_RUNTIME_SMOKE_RESULTS.json', encoding='utf-8'))
          i = json.load(open('04_BEHAVIOR_INTEGRITY.json', encoding='utf-8'))
          c = json.load(open('04_BEHAVIOR_COVERAGE.json', encoding='utf-8'))
          q = json.load(open('04_RUNTIME_OBSERVATION_QUEUE.json', encoding='utf-8'))
          assert s['frozen_commit'] == '3cca18b368ae95cdbdebbff572ccafa662551015'
          assert s['source_checkout_head'] == s['frozen_commit']
          assert s['synthetic_inputs_only'] is True
          assert s['user_or_live_repo_touched'] is False
          assert s['test_count'] == 6
          assert s['pass_count'] == 6
          assert s['fail_count'] == 0
          assert s['hard_errors'] == []
          assert s['runtime_closure_behavior_ids'] == ['B-016', 'B-019', 'B-020']
          assert s['supporting_only_behavior_ids'] == ['B-018', 'B-056']
          assert i['hard_errors'] == []
          assert i['runtime_observed_count'] >= 3
          assert c['covered_skills'] == 37 and c['skill_denominator'] == 37
          assert c['covered_surfaces'] == 71 and c['surface_denominator'] == 71
          assert q['hard_errors'] == []
          assert q['runtime_observed'] == i['runtime_observed_count']
          observed = {x['behavior_id'] for x in q['items'] if x['runtime_observed']}
          assert {'B-016', 'B-019', 'B-020'} <= observed
          assert 'B-018' not in observed
          assert 'B-056' not in observed
          print('runtime_smoke_pass=', f"{s['pass_count']}/{s['test_count']}")
          print('runtime_closures=', s['runtime_closure_behavior_ids'])
          print('runtime_observed_total=', i['runtime_observed_count'])
          print('pending_by_class=', q['pending_by_class'])
          PY
      - name: Commit runtime evidence and Phase 4 promotion
        run: |
          paths=(04_RUNTIME_SMOKE_RESULTS.json 04_RUNTIME_SMOKE_RESULTS.md 04_BEHAVIOR_MATRIX.json 04_BEHAVIOR_MATRIX.md 04_BEHAVIOR_INTEGRITY.json 04_BEHAVIOR_COVERAGE.json 04_BEHAVIOR_COVERAGE.md 04_RUNTIME_OBSERVATION_QUEUE.json 04_RUNTIME_OBSERVATION_QUEUE.md)
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- "${paths[@]}"
          if git diff --cached --quiet; then
            echo "Runtime smoke evidence already current"
            exit 0
          fi
          git commit -m "phase4: record isolated frozen-source runtime evidence"
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep 1
          done
          echo "Failed to publish Phase 4 runtime evidence" >&2
          exit 1
