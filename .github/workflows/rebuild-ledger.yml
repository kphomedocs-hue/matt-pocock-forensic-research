name: Rebuild master ledger

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_master_ledger.py"
      - "02_FILE_NOTES/**"
      - ".github/workflows/rebuild-ledger.yml"

permissions:
  contents: write

# Generated-file workflows share one write lane. Connector/API writes can still
# land while a run is active, so the push step also rebases and retries.
concurrency:
  group: forensic-generated-main-writes
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research repo
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Sync latest main before generation
        run: git pull --ff-only origin main

      - name: Rebuild frozen census and ledger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_master_ledger.py

      - name: Validate physical denominator and outputs
        run: |
          test -s 01_FILE_CENSUS.json
          test -s 01_MASTER_FILE_LEDGER.md
          python - <<'PY'
          import json
          data = json.load(open('01_FILE_CENSUS.json', encoding='utf-8'))
          assert data['blob_count'] == 164, data['blob_count']
          assert data['truncated'] is False
          assert len(data['files']) == 164
          assert len({f['mp_id'] for f in data['files']}) == 164
          assert len({f['path'] for f in data['files']}) == 164
          print('Validated 164 unique frozen blobs and MP-IDs')
          PY

      - name: Commit regenerated ledger
        run: |
          if [[ -z "$(git status --porcelain -- 01_MASTER_FILE_LEDGER.md 01_FILE_CENSUS.json)" ]]; then
            echo "Ledger already current"
            exit 0
          fi
          git config user.name "forensic-ledger-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 01_MASTER_FILE_LEDGER.md 01_FILE_CENSUS.json
          git commit -m "audit: rebuild 164-file frozen census"

          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push race on attempt $attempt; rebasing onto latest main"
            git fetch origin main
            git rebase origin/main
            sleep 1
          done
          echo "Failed to publish regenerated ledger after 5 attempts" >&2
          exit 1
