name: Phase 4 deep-module runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/run_phase4_deep_module_runtime.py'
      - 'scripts/validate_phase4_runtime_provenance.py'
      - '.github/workflows/phase4-deep-module-runtime.yml'

permissions:
  contents: write

concurrency:
  group: forensic-phase4-deep-module-runtime
  cancel-in-progress: false

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research state
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Checkout exact frozen source
        uses: actions/checkout@v7.0.1
        with:
          repository: mattpocock/skills
          ref: 3cca18b368ae95cdbdebbff572ccafa662551015
          path: frozen-source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Sync latest research main
        run: git pull --ff-only origin main
      - name: Validate runner prerequisites
        run: |
          command -v git
          command -v python
          command -v node
          command -v npm
          test "$(git -C frozen-source rev-parse HEAD)" = "3cca18b368ae95cdbdebbff572ccafa662551015"
      - name: Run isolated deep-module runtime harness
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scripts/run_phase4_deep_module_runtime.py --source frozen-source
      - name: Rebuild Phase 4 state after deep-module evidence
        run: |
          python scripts/validate_behavior_matrix.py
          python scripts/build_phase4_coverage.py
          python scripts/build_phase4_runtime_queue.py
      - name: Refresh foundation after runtime promotion
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/validate_foundation.py
      - name: Validate runtime provenance and promotion gate
        run: |
          python scripts/validate_phase4_runtime_provenance.py
          python - <<'PY'
          import json
          r = json.load(open('04_DEEP_MODULE_RUNTIME_RESULTS.json', encoding='utf-8'))
          m = json.load(open('04_BEHAVIOR_MATRIX.json', encoding='utf-8'))
          i = json.load(open('04_BEHAVIOR_INTEGRITY.json', encoding='utf-8'))
          q = json.load(open('04_RUNTIME_OBSERVATION_QUEUE.json', encoding='utf-8'))
          f = json.load(open('00_FOUNDATION_INTEGRITY.json', encoding='utf-8'))
          assert r['frozen_commit'] == '3cca18b368ae95cdbdebbff572ccafa662551015'
          assert r['source_checkout_head'] == r['frozen_commit']
          assert r['synthetic_inputs_only'] is True
          assert r['user_or_live_repo_touched'] is False
          assert r['hard_errors'] == []
          assert r['runtime_closure_behavior_ids'] == ['B-012', 'B-014']
          tests = {x['test_id']: x for x in r['tests']}
          assert tests['DM-001']['passed'] is True
          assert tests['DM-002']['passed'] is True
          rows = {x['behavior_id']: x for x in m['rows']}
          assert rows['B-012']['runtime_observed'] is True
          assert rows['B-014']['runtime_observed'] is True
          assert rows['B-012']['state'] == 'CONFIRMED_GAP'
          assert rows['B-014']['state'] == 'STATICALLY_ENFORCED'
          assert i['hard_errors'] == []
          assert i['runtime_observed_count'] >= 10
          assert q['hard_errors'] == []
          assert q['runtime_observed'] == i['runtime_observed_count']
          assert f['hard_errors'] == []
          print('deep_module_runtime=', r['runtime_closure_behavior_ids'])
          print('dependency_cruiser_version=', r['dependency_cruiser_version'])
          print('runtime_observed_total=', i['runtime_observed_count'])
          print('pending_total=', q['pending_total'])
          PY
      - name: Rebuild research checkpoint
        run: python scripts/build_research_status.py
      - name: Commit deep-module runtime evidence
        run: |
          paths=(04_DEEP_MODULE_RUNTIME_RESULTS.json 04_DEEP_MODULE_RUNTIME_RESULTS.md 04_BEHAVIOR_MATRIX.json 04_BEHAVIOR_MATRIX.md 04_BEHAVIOR_INTEGRITY.json 04_BEHAVIOR_COVERAGE.json 04_BEHAVIOR_COVERAGE.md 04_RUNTIME_OBSERVATION_QUEUE.json 04_RUNTIME_OBSERVATION_QUEUE.md 00_FOUNDATION_INTEGRITY.json 00_FOUNDATION_INTEGRITY.md RESEARCH_STATUS.md)
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- "${paths[@]}"
          if git diff --cached --quiet; then
            echo "Deep-module runtime evidence and research checkpoint already current"
            exit 0
          fi
          git commit -m "phase4: record deep-module runtime evidence"
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep 1
          done
          echo "Failed to publish deep-module runtime evidence" >&2
          exit 1
