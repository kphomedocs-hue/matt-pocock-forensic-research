name: Rebuild Phase 3 history bindings

on:
  push:
    branches: [main]
    paths:
      - '01_FILE_CENSUS.json'
      - '05_HISTORY_LEDGER.md'
      - 'scripts/build_history_bindings.py'
      - '.github/workflows/rebuild-history-bindings.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forensic-rebuild-history-bindings
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Sync latest main before generation
        run: git pull --ff-only origin main
      - name: Build history bindings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_history_bindings.py
      - name: Validate generated outputs
        run: |
          test -s 03_HISTORY_BINDINGS.json
          test -s 03_HISTORY_BINDINGS.md
          python - <<'PY'
          import json
          d = json.load(open('03_HISTORY_BINDINGS.json', encoding='utf-8'))
          assert d['file_count'] == 164
          assert d['history_event_count'] == 9
          assert {e['history_id'] for e in d['events']} == {f'H-{i:03d}' for i in range(1, 10)}
          assert all(e['current_frozen_bindings'] for e in d['events']), 'history event with zero current-file bindings'
          print('files_with_bindings=', d['files_with_history_bindings'])
          print('bindings=', d['binding_count'])
          PY
      - name: Commit generated history bindings
        run: |
          if [[ -z "$(git status --porcelain -- 03_HISTORY_BINDINGS.json 03_HISTORY_BINDINGS.md)" ]]; then
            echo "No history-binding changes"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 03_HISTORY_BINDINGS.json 03_HISTORY_BINDINGS.md
          git commit -m "phase3: rebuild history binding index"

          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push race on attempt $attempt; rebasing onto latest main"
            git fetch origin main
            git rebase origin/main
            sleep 1
          done
          echo "Failed to publish history bindings after 5 attempts" >&2
          exit 1
