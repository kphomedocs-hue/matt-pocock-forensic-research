name: Validate Phase 4 behavior matrix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '04_BEHAVIOR_MATRIX.json'
      - '04_CONTRADICTION_REGISTER.md'
      - '01_FILE_CENSUS.json'
      - 'scripts/validate_behavior_matrix.py'
      - 'scripts/build_phase4_coverage.py'
      - '.github/workflows/validate-phase4-behavior.yml'

permissions:
  contents: write

concurrency:
  group: forensic-validate-phase4-behavior
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Sync latest main
        run: git pull --ff-only origin main
      - name: Validate and render behavior matrix
        run: python scripts/validate_behavior_matrix.py
      - name: Build Phase 4 behavior coverage
        run: python scripts/build_phase4_coverage.py
      - name: Validate generated outputs
        run: |
          test -s 04_BEHAVIOR_MATRIX.md
          test -s 04_BEHAVIOR_INTEGRITY.json
          test -s 04_BEHAVIOR_COVERAGE.md
          test -s 04_BEHAVIOR_COVERAGE.json
          python - <<'PY'
          import json
          d = json.load(open('04_BEHAVIOR_INTEGRITY.json', encoding='utf-8'))
          c = json.load(open('04_BEHAVIOR_COVERAGE.json', encoding='utf-8'))
          assert d['hard_errors'] == []
          assert d['row_count'] >= 20
          assert d.get('uncovered_current_contradiction_ids', []) == []
          assert c['schema_version'] == 2
          assert c['hard_errors'] == []
          assert c['skill_denominator'] == 37
          assert c['covered_skills'] + c['uncovered_skills'] == 37
          assert c['surface_denominator'] > 0
          assert c['covered_surfaces'] + c['uncovered_surfaces'] == c['surface_denominator']
          print('behavior_rows=', d['row_count'])
          print('states=', d['state_counts'])
          print('runtime_observed=', d['runtime_observed_count'])
          print('skill_coverage=', f"{c['covered_skills']}/{c['skill_denominator']}")
          print('uncovered_skills=', c['uncovered_mp_ids'])
          print('surface_coverage=', f"{c['covered_surfaces']}/{c['surface_denominator']}")
          print('uncovered_surfaces=', c['uncovered_surface_mp_ids'])
          PY
      - name: Commit rendered Phase 4 state
        run: |
          paths=(04_BEHAVIOR_MATRIX.md 04_BEHAVIOR_INTEGRITY.json 04_BEHAVIOR_COVERAGE.md 04_BEHAVIOR_COVERAGE.json)
          if [[ -z "$(git status --porcelain -- "${paths[@]}")" ]]; then
            echo "Phase 4 outputs already current"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "${paths[@]}"
          git commit -m "phase4: render validated behavior and coverage state"
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep 1
          done
          echo "Failed to publish Phase 4 outputs" >&2
          exit 1
