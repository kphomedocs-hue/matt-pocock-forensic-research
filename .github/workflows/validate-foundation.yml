name: Validate forensic foundation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '01_FILE_CENSUS.json'
      - '02_FILE_NOTES/**'
      - '04_CONTRADICTION_REGISTER.md'
      - '05_HISTORY_LEDGER.md'
      - 'scripts/validate_foundation.py'
      - '.github/workflows/validate-foundation.yml'

permissions:
  contents: write

concurrency:
  group: forensic-validate-foundation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Sync latest main before validation
        run: git pull --ff-only origin main
      - name: Generate foundation report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/validate_foundation.py || true
      - name: Validate generated report files
        run: |
          test -s 00_FOUNDATION_INTEGRITY.json
          test -s 00_FOUNDATION_INTEGRITY.md
      - name: Commit generated foundation report
        run: |
          if [[ -z "$(git status --porcelain -- 00_FOUNDATION_INTEGRITY.json 00_FOUNDATION_INTEGRITY.md)" ]]; then
            echo "Foundation report already current"
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add 00_FOUNDATION_INTEGRITY.json 00_FOUNDATION_INTEGRITY.md
            git commit -m "foundation: refresh integrity report"
            for attempt in 1 2 3 4 5; do
              if git push; then break; fi
              echo "Push race on attempt $attempt; rebasing onto latest main"
              git fetch origin main
              git rebase origin/main
              if [[ "$attempt" == "5" ]]; then
                echo "Failed to publish foundation report after 5 attempts" >&2
                exit 1
              fi
            done
          fi
      - name: Enforce hard-integrity and contradiction-parity gate
        run: |
          python - <<'PY'
          import json, re
          data = json.load(open('00_FOUNDATION_INTEGRITY.json', encoding='utf-8'))
          errors = data.get('hard_errors', [])
          print(f"Hard integrity errors: {len(errors)}")
          for error in errors:
              print(f"- {error}")
          if errors:
              raise SystemExit(1)

          text = open('04_CONTRADICTION_REGISTER.md', encoding='utf-8').read()
          register_ids = re.findall(r'^\| (CT-\d{3}) \|', text, re.MULTILINE)
          reported_ids = data.get('contradiction_ids_current', [])
          if register_ids != reported_ids:
              raise SystemExit(f"Foundation contradiction parity failed: register={register_ids}, report={reported_ids}")
          nums = [int(x.split('-')[1]) for x in register_ids]
          expected = list(range(1, len(nums) + 1))
          if nums != expected:
              raise SystemExit(f"Current contradiction IDs are not contiguous: {register_ids}")
          print(f"Current contradiction parity: {len(register_ids)} IDs, contiguous and exact")
          PY
